<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>농심 일부인 실시간 검증 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f5f6fa; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; text-align: center; color: #ff3333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 20px; }
        .status-box { padding: 12px; border-radius: 10px; background-color: #ebf5fb; border-left: 5px solid #3498db; margin-bottom: 15px; font-size: 15px; font-weight: bold; }
        .cam-btn { display: block; width: 100%; height: 65px; color: white; text-align: center; line-height: 65px; font-size: 20px; font-weight: bold; border-radius: 15px; cursor: pointer; border: none; margin-bottom: 15px; }
        .btn-master { background: #e67e22; box-shadow: 0 4px 10px rgba(230,126,34,0.3); }
        .btn-test { background: #3498db; box-shadow: 0 4px 10px rgba(52,152,219,0.3); }
        #loading { display: none; text-align: center; font-weight: bold; color: #e67e22; margin: 15px 0; }
        .result-box { display: none; padding: 20px; border-radius: 15px; text-align: center; font-size: 28px; font-weight: bold; margin-top: 15px; }
        .ok { background-color: #e8f8f5; color: #2ecc71; border: 4px solid #2ecc71; }
        .ng { background-color: #fadbd8; color: #e74c3c; border: 4px solid #e74c3c; }
        .info-text { font-size: 15px; color: #555; font-weight: normal; margin-top: 8px; line-height: 1.4; }
        .data-monitor { background: #f8f9fa; padding: 10px; border-radius: 10px; font-size: 14px; margin-top: 10px; border: 1px solid #dee2e6; }
        .btn-next { display: none; width: 100%; height: 55px; background: #2ecc71; color: white; font-size: 18px; font-weight: bold; border-radius: 12px; border: none; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍜 부산생산1팀 일부인 검증 시스템</h1>
    <div class="subtitle">독립형 전송 파괴 알고리즘 적용 버전 (V12.0)</div>

    <div id="master_zone">
        <div class="status-box">📢 [1단계] 오늘 작업할 기준 마스터(표준 샘플)를 촬영해 주세요.</div>
        <button class="cam-btn btn-master" onclick="document.getElementById('master_shutter').click();">🎯 기준 마스터 사진 촬영</button>
        <input type="file" accept="image/*" capture="environment" id="master_shutter" style="display: none;" onchange="readMaster(this);">
    </div>

    <div id="test_zone" style="display: none;">
        <div class="status-box">📢 [2단계] 기준 등록 완료! 현재 라인의 생산 제품을 촬영해 주세요.</div>
        <button class="cam-btn btn-test" onclick="document.getElementById('test_shutter').click();">🔍 생산 제품 사진 촬영</button>
        <input type="file" accept="image/*" capture="environment" id="test_shutter" style="display: none;" onchange="readTest(this);">
    </div>

    <div id="loading">⚡ AI가 일부인 숫자를 추출하는 중...</div>

    <div class="data-monitor">
        <div><b>🎯 등록된 마스터 숫자:</b> <span id="m_val">미등록</span></div>
        <div><b>🔍 실시간 검사 제품 숫자:</b> <span id="t_val">미검사</span></div>
    </div>

    <div id="result_display" class="result-box"></div>
    <button id="next_btn" class="btn-next" onclick="resetForNextCheck();">🔄 다음 생산제품 추가 검사 (매시간 검사)</button>
</div>

<script>
// 스마트폰 브라우저가 옛날 사진을 기억하지 못하게 차단하는 핵심 가상 메모리
let savedMasterNumbers = "";
let savedTestNumbers = "";

function readMaster(input) {
    const file = input.files[0];
    if (!file) return;
    document.getElementById('loading').style.display = 'block';
    
    runOcr(file, function(extractedText) {
        savedMasterNumbers = extractedText.replace(/[^0-9]/g, '');
        document.getElementById('loading').style.display = 'none';
        
        if (savedMasterNumbers.length < 4) {
            alert("기준 마스터 사진에서 숫자를 인식하지 못했습니다. 더 가까이서 다시 찍어주세요.");
            return;
        }
        
        document.getElementById('m_val').innerText = savedMasterNumbers;
        document.getElementById('master_zone').style.display = 'none'; // 마스터 창 숨기기
        document.getElementById('test_zone').style.display = 'block';  // 제품 검사 창 열기
    });
}

function readTest(input) {
    const file = input.files[0];
    if (!file) return;
    document.getElementById('loading').style.display = 'block';
    
    runOcr(file, function(extractedText) {
        savedTestNumbers = extractedText.replace(/[^0-9]/g, '');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('t_val').innerText = savedTestNumbers;
        
        // 1:1 최종 대조 판정 시작
        const display = document.getElementById('result_display');
        display.style.display = 'block';
        
        if (savedMasterNumbers === savedTestNumbers && savedTestNumbers !== "") {
            display.className = "result-box ok";
            display.innerHTML = `🟢 일치 (OK) <div class="info-text">일부인이 마스터와 정확히 일치합니다. 생산을 계속 진행하세요.</div>`;
        } else {
            display.className = "result-box ng";
            display.innerHTML = `🔴 불일치 (NG) <div class="info-text">마킹 정보가 다릅니다! 마킹기 세팅을 확인하세요.<br>🎯 마스터: ${savedMasterNumbers}<br>🔍 현재제품: ${savedTestNumbers}</div>`;
        }
        document.getElementById('next_btn').style.display = 'block'; // 다음 검사 버튼 등장
    });
}

// 이미지 압축 및 OCR 구동 모듈
function runOcr(file, callback) {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxWidth = 500;
            const scale = maxWidth / img.width;
            canvas.width = maxWidth;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            Tesseract.recognize(
                canvas.toDataURL('image/jpeg', 0.4),
                'eng',
                { tessedit_char_whitelist: '0123456789' }
            ).then(({ data: { text } }) => {
                callback(text);
            });
        }
    };
}

// [핵심 해결책] 다음 검사를 누르면 이전 제품 찌꺼기 파일과 메모리를 완전 포맷합니다.
function resetForNextCheck() {
    savedTestNumbers = "";
    document.getElementById('t_val').innerText = "미검사";
    document.getElementById('test_shutter').value = ""; // 브라우저 파일 찌꺼기 파괴
    document.getElementById('result_display').style.display = 'none';
    document.getElementById('next_btn').style.display = 'none';
    
    // 강제로 제품 촬영 버튼이 있는 2단계로만 깔끔하게 되돌아갑니다. (마스터 사진은 그대로 유지)
    document.getElementById('test_zone').style.display = 'block';
}
</script>
</body>
</html>
